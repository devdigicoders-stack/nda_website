<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a1f"/>
      <stop offset="50%" stop-color="#142c15"/>
      <stop offset="100%" stop-color="#0a190b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Emblem / Shield -->
  <g transform="translate(10, 8)">
    <path d="M32 6 L56 16 V36 C56 52 32 64 32 64 C32 64 8 52 8 36 V16 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M32 10 L52 19 V36 C52 49 32 59 32 59 C32 59 12 49 12 36 V19 Z" fill="none" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1"/>
    <!-- Star -->
    <polygon points="32,20 35,28 44,28 37,33 40,41 32,36 24,41 27,33 20,28 29,28" fill="url(#goldGrad)" />
    <!-- Chevron -->
    <path d="M22 47 L32 42 L42 47" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="75" y="36" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="1">
    SHAURYA
  </text>
  <text x="195" y="36" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#eab308" letter-spacing="1.5">
    NDA &amp; SSB
  </text>
  <text x="76" y="54" font-family="'Inter', sans-serif" font-weight="600" font-size="10.5" fill="#94a3b8" letter-spacing="2.5">
    PREMIER DEFENCE ACADEMY
  </text>
</svg>
