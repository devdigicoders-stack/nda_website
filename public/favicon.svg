<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a1f"/>
      <stop offset="50%" stop-color="#142c15"/>
      <stop offset="100%" stop-color="#0a190b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Shield Base -->
  <path d="M50 8 L85 24 V52 C85 74 50 92 50 92 C50 92 15 74 15 52 V24 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Inner Border -->
  <path d="M50 14 L80 28 V52 C80 70 50 85 50 85 C50 85 20 70 20 52 V28 Z" fill="none" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1.5"/>
  <!-- Central Star -->
  <polygon points="50,28 54,40 67,40 57,48 61,60 50,52 39,60 43,48 33,40 46,40" fill="url(#goldGrad)" />
  <!-- Crossed Swords / Wing Accent -->
  <path d="M35 68 L50 60 L65 68" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
